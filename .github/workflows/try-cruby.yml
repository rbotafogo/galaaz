# Publish the CRuby try image to GitHub Container Registry (public, free).
# Strangers: docker run --rm -it ghcr.io/rbotafogo/galaaz-try:cruby
name: Publish CRuby try image

on:
  push:
    branches: [galaaz2_0]
    paths:
      - 'docker/try-cruby/**'
      - '.github/workflows/try-cruby.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: try-cruby-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    name: Build and push GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/try-cruby
          push: true
          tags: ghcr.io/rbotafogo/galaaz-try:cruby
          labels: |
            org.opencontainers.image.source=https://github.com/rbotafogo/galaaz
            org.opencontainers.image.description=Galaaz 2.1.8 try image (CRuby + GNU R)
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          build-args: |
            RUBY_VERSION=3.3.12
            GALAAZ_VERSION=2.1.8
